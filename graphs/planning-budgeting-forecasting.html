<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planning, Budgeting and Forecasting — Knowledge Graph</title>
  <script type="text/javascript" src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #FFFFFF 0%, #F1F5F9 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #0F172A;
      user-select: none;
    }
    #network-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    /* Top Toolbar */
    .toolbar {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 12px;
      padding: 6px;
      z-index: 20;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }
    .tool-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #475569;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .tool-btn:hover {
      background: rgba(241, 245, 249, 0.95);
      color: #0F172A;
      border-color: #CBD5E1;
    }
    .tool-btn.active {
      background: rgba(59, 130, 246, 0.12);
      color: #2563EB;
      border-color: rgba(59, 130, 246, 0.35);
    }
    /* Floating Domain Badge */
    .domain-badge {
      position: absolute;
      top: 16px;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 12px;
      padding: 8px 14px;
      z-index: 20;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }
    .domain-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #2E6FCA;
      box-shadow: 0 0 8px #2E6FCA;
    }
    .domain-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #0F172A;
    }
    .domain-stats {
      font-size: 11px;
      color: #64748B;
      margin-left: 4px;
    }
    /* Legend */
    .legend {
      position: absolute;
      bottom: 16px;
      left: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-width: 60%;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 12px;
      padding: 8px 12px;
      z-index: 20;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #334155;
      font-weight: 500;
    }
    .legend-color {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    /* Node Info Overlay */
    .inspector {
      position: absolute;
      bottom: 16px;
      right: 16px;
      width: 320px;
      max-height: 280px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(226, 232, 240, 0.95);
      border-radius: 14px;
      padding: 14px;
      z-index: 20;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.12);
      display: none;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      transition: opacity 0.2s ease;
    }
    .inspector.open {
      display: flex;
    }
    .inspector-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid #E2E8F0;
      padding-bottom: 8px;
    }
    .inspector-title {
      font-size: 14px;
      font-weight: 700;
      color: #0F172A;
    }
    .inspector-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      background: #EFF6FF;
      color: #1D4ED8;
      border: 1px solid #DBEAFE;
    }
    .inspector-close {
      background: transparent;
      border: none;
      color: #94A3B8;
      font-size: 16px;
      cursor: pointer;
      line-height: 1;
    }
    .inspector-close:hover {
      color: #0F172A;
    }
    .inspector-def {
      font-size: 11px;
      line-height: 1.5;
      color: #475569;
    }
    .inspector-section {
      margin-top: 4px;
    }
    .inspector-subtitle {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748B;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .tag {
      background: #F1F5F9;
      border: 1px solid #E2E8F0;
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 10px;
      color: #334155;
      font-family: 'JetBrains Mono', monospace;
    }
    .formula-tag {
      background: #ECFDF5;
      border: 1px solid #A7F3D0;
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 10px;
      color: #065F46;
      font-family: 'JetBrains Mono', monospace;
      width: 100%;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div id="network-container"></div>

  <!-- Domain Header -->
  <div class="domain-badge">
    <div class="domain-dot"></div>
    <span class="domain-title">Planning, Budgeting and Forecasting</span>
    <span class="domain-stats">(9 nodes &middot; 9 edges)</span>
  </div>

  <!-- Action Controls -->
  <div class="toolbar">
    <button class="tool-btn" id="btn-fit" title="Fit to Screen">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
      Fit
    </button>
    <button class="tool-btn" id="btn-zoom-in" title="Zoom In">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    </button>
    <button class="tool-btn" id="btn-zoom-out" title="Zoom Out">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    </button>
    <button class="tool-btn active" id="btn-physics" title="Toggle Physics">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      Physics
    </button>
  </div>

  <!-- Groups Legend -->
  <div class="legend" id="legend"></div>

  <!-- Inspector Card -->
  <div class="inspector" id="inspector">
    <div class="inspector-header">
      <div>
        <div class="inspector-title" id="insp-name">Entity</div>
        <div class="inspector-badge" id="insp-group">Group</div>
      </div>
      <button class="inspector-close" id="insp-close">&times;</button>
    </div>
    <div class="inspector-def" id="insp-def"></div>
    <div class="inspector-section" id="insp-attrs-section">
      <div class="inspector-subtitle">Attributes</div>
      <div class="tag-container" id="insp-attrs"></div>
    </div>
    <div class="inspector-section" id="insp-formulas-section">
      <div class="inspector-subtitle">Key Calculation Formulas</div>
      <div id="insp-formulas"></div>
    </div>
  </div>

  <script type="text/javascript">
    const rawNodes = [{"key": "budgetmeth", "name": "BudgetMethodology", "group_key": "f1", "group_name": "F1 Planning, Budgeting & Forecasting", "color": "#2E6FCA", "kind": "domain", "role": "core", "definition": "The methodology set evidenced across the corpus: top-down target vs bottom-up, driver-based, rolling, zero-based (ZBB with cost-package ownership), activity-based, and adaptive/lean with quarterly reviews.", "attributes": ["methodology", "zbbCostPackages", "targetCascade", "reviewCadence", "sandbagging (anti-pattern)"], "formulas": [], "origin": "reference", "change_state": "unchanged"}, {"key": "driverinput", "name": "DriverBasedInput", "group_key": "f1", "group_name": "F1 Planning, Budgeting & Forecasting", "color": "#2E6FCA", "kind": "domain", "role": "core", "definition": "Operational drivers planned first and translated into cost/revenue lines — fuel price, trips, line speed, volume, rate cards — the mechanic that lifts planning from account-level guesswork to causal models.", "attributes": ["driverName", "driverUom", "mappingToAccount", "elasticity", "driverTree"], "formulas": [], "origin": "reference", "change_state": "unchanged"}, {"key": "fcastbench", "name": "PlanningBenchmarks", "group_key": "f1", "group_name": "F1 Planning, Budgeting & Forecasting", "color": "#2E6FCA", "kind": "domain", "role": "core", "definition": "Best-in-class planning performance: budget accuracy 104% (actual/budget), forecast accuracy 103%, best-in-class are 400% more likely to link compensation to budget performance; budget-cycle compression benchmark −65%.", "attributes": ["budgetAccuracy 104%", "forecastAccuracy 103%", "compLinkage ×4", "budgetCycle −65%"], "formulas": [], "origin": "reference", "change_state": "unchanged"}, {"key": "maturity", "name": "PlanningMaturityCurve", "group_key": "f1", "group_name": "F1 Planning, Budgeting & Forecasting", "color": "#2E6FCA", "kind": "domain", "role": "core", "definition": "4-level maturity: Ad-hoc → Traditional (static annual Excel) → Coherent & Diagnostic (driver-based + rolling forecast + workflow + multidimensional variance) → Prescriptive (predictive, scenario, suggested decision options).", "attributes": ["maturityLevel (1–4)", "levelCriteria", "assessmentPerProcess"], "formulas": [], "origin": "reference", "change_state": "unchanged"}, {"key": "plancal", "name": "PlanningCalendarPattern", "group_key": "f1", "group_name": "F1 Planning, Budgeting & Forecasting", "color": "#2E6FCA", "kind": "domain", "role": "core", "definition": "The evidenced annual rhythm: Q1 AOP actualization · Q2 full-year forecast · Q3 balance-sheet bottom-up · Q4 AOP-level forecast — reforecast cycles (PPR) interleave monthly.", "attributes": ["quarterPattern", "aopMilestones", "pprSchedule"], "formulas": [], "origin": "reference", "change_state": "unchanged"}, {"key": "planversion", "name": "PlanningVersion / Scenario", "group_key": "f1", "group_name": "F1 Planning, Budgeting & Forecasting", "color": "#2E6FCA", "kind": "domain", "role": "core", "definition": "The version backbone of planning: actual · plan/budget (annual plan, 1YP) · reforecast (PPR-n = n months actual + remainder forecast) · latest estimate · prior year · constant-FX variants · scenario slots, with organic flags and driver-based inputs.", "attributes": ["versionType", "pprCycle", "organicFlag", "constantFxVariants", "scenarioSlot", "workflowState"], "formulas": ["PPR-n = n months actual + remainder forecast"], "origin": "reference", "change_state": "unchanged"}, {"key": "rollfc", "name": "RollingForecast / PPR", "group_key": "f1", "group_name": "F1 Planning, Budgeting & Forecasting", "color": "#2E6FCA", "kind": "domain", "role": "core", "definition": "Reforecast machinery: PPR-n versions blend actuals and forecast; rolling forecasts extend beyond year-end to kill the fiscal-year cliff; modernization practice pairs it with workflow and variance analytics.", "attributes": ["horizon", "blendRule (n actual + 12−n fc)", "cadence", "workflow"], "formulas": [], "origin": "reference", "change_state": "unchanged"}, {"key": "simclass", "name": "SimulationClass", "group_key": "f1", "group_name": "F1 Planning, Budgeting & Forecasting", "color": "#2E6FCA", "kind": "domain", "role": "core", "definition": "Deterministic simulation (rule-driven, ~1yr history, ~1-month time-to-value) vs stochastic (multivariate, full business cycle 3–5yrs of data, exogenous drivers FX/commodity/fuel/credit, 2–3-month time-to-value).", "attributes": ["simType", "dataHorizon", "exogenousDrivers[]", "timeToValue"], "formulas": [], "origin": "reference", "change_state": "unchanged"}, {"key": "timedim", "name": "Time / Calendar", "group_key": "spine", "group_name": "Finance master-data spine", "color": "#5A8AC3", "kind": "spine", "role": "shared", "definition": "Fiscal calendar with the performance-period vs posting-period convention (trade events booked when earned vs when posted) and the planning calendar pattern layered on top.", "attributes": ["fiscalYear", "period", "performancePeriod", "postingPeriod", "weekPattern", "closingDay"], "formulas": [], "origin": "reference", "change_state": "unchanged"}];
    const rawEdges = [{"source": "timedim", "target": "planversion", "label": "period basis", "origin": "reference", "change_state": "unchanged", "cross_domain": false, "origin_graph": "finance-graph"}, {"source": "timedim", "target": "plancal", "label": "carries rhythm", "origin": "reference", "change_state": "unchanged", "cross_domain": false, "origin_graph": "finance-graph"}, {"source": "budgetmeth", "target": "planversion", "label": "produces versions", "origin": "reference", "change_state": "unchanged", "cross_domain": false, "origin_graph": "finance-graph"}, {"source": "plancal", "target": "planversion", "label": "schedules", "origin": "reference", "change_state": "unchanged", "cross_domain": false, "origin_graph": "finance-graph"}, {"source": "driverinput", "target": "planversion", "label": "drives inputs", "origin": "reference", "change_state": "unchanged", "cross_domain": false, "origin_graph": "finance-graph"}, {"source": "rollfc", "target": "planversion", "label": "reforecasts (PPR-n)", "origin": "reference", "change_state": "unchanged", "cross_domain": false, "origin_graph": "finance-graph"}, {"source": "maturity", "target": "budgetmeth", "label": "stages methodology", "origin": "reference", "change_state": "unchanged", "cross_domain": false, "origin_graph": "finance-graph"}, {"source": "simclass", "target": "driverinput", "label": "simulates drivers", "origin": "reference", "change_state": "unchanged", "cross_domain": false, "origin_graph": "finance-graph"}, {"source": "fcastbench", "target": "maturity", "label": "benchmarks levels", "origin": "reference", "change_state": "unchanged", "cross_domain": false, "origin_graph": "finance-graph"}];

    // Build Legend
    const legendEl = document.getElementById('legend');
    const groupMap = new Map();
    rawNodes.forEach(n => {
      if (n.group_name && !groupMap.has(n.group_name)) {
        groupMap.set(n.group_name, n.color || '#2E6FCA');
      }
    });
    groupMap.forEach((color, name) => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<span class="legend-color" style="background:${color};box-shadow:0 0 6px ${color}"></span><span>${name}</span>`;
      legendEl.appendChild(item);
    });

    // Transform Nodes for Vis.js (White / Light Theme)
    const visNodes = rawNodes.map(n => {
      const nodeColor = n.color || '#2E6FCA';
      return {
        id: n.key,
        label: n.name,
        group: n.group_name,
        color: {
          background: '#FFFFFF',
          border: nodeColor,
          highlight: {
            background: '#F0F9FF',
            border: nodeColor
          },
          hover: {
            background: '#F8FAFC',
            border: nodeColor
          }
        },
        font: {
          color: '#0F172A',
          size: 13,
          face: 'Inter, sans-serif',
          bold: true
        },
        shape: 'box',
        margin: 12,
        borderWidth: 2,
        borderWidthSelected: 3,
        shadow: {
          enabled: true,
          color: 'rgba(0, 0, 0, 0.08)',
          size: 8,
          x: 1,
          y: 3
        },
        raw: n
      };
    });

    // Transform Edges for Vis.js (White / Light Theme)
    const visEdges = rawEdges.map((e, idx) => {
      return {
        id: 'e_' + idx,
        from: e.source,
        to: e.target,
        label: e.label || '',
        arrows: {
          to: {
            enabled: true,
            scaleFactor: 0.8
          }
        },
        color: {
          color: '#94A3B8',
          highlight: '#2563EB',
          hover: '#64748B'
        },
        font: {
          color: '#475569',
          size: 11,
          face: 'Inter, sans-serif',
          align: 'middle',
          background: 'rgba(255, 255, 255, 0.95)'
        },
        smooth: {
          type: 'curvedCW',
          roundness: 0.2
        },
        length: 220
      };
    });

    const container = document.getElementById('network-container');
    const nodesDataset = new vis.DataSet(visNodes);
    const edgesDataset = new vis.DataSet(visEdges);

    const data = {
      nodes: nodesDataset,
      edges: edgesDataset
    };

    const options = {
      physics: {
        enabled: true,
        solver: 'forceAtlas2Based',
        forceAtlas2Based: {
          gravitationalConstant: -50,
          centralGravity: 0.01,
          springLength: 160,
          springConstant: 0.08,
          damping: 0.4
        },
        stabilization: {
          iterations: 160,
          updateInterval: 25
        }
      },
      interaction: {
        hover: true,
        tooltipDelay: 150,
        selectable: true,
        multiselect: false,
        navigationButtons: false,
        zoomView: true,
        dragView: true
      }
    };

    const network = new vis.Network(container, data, options);

    // Inspector elements
    const inspector = document.getElementById('inspector');
    const inspName = document.getElementById('insp-name');
    const inspGroup = document.getElementById('insp-group');
    const inspDef = document.getElementById('insp-def');
    const inspAttrs = document.getElementById('insp-attrs');
    const inspAttrsSection = document.getElementById('insp-attrs-section');
    const inspFormulas = document.getElementById('insp-formulas');
    const inspFormulasSection = document.getElementById('insp-formulas-section');
    const inspClose = document.getElementById('insp-close');

    function showDetails(nodeRaw) {
      if (!nodeRaw) {
        inspector.classList.remove('open');
        return;
      }
      inspName.textContent = nodeRaw.name || nodeRaw.key;
      inspGroup.textContent = nodeRaw.group_name || 'Planning, Budgeting and Forecasting';
      inspDef.textContent = nodeRaw.definition || 'No definition available.';

      const attrs = nodeRaw.attributes || [];
      if (attrs.length > 0) {
        inspAttrsSection.style.display = 'block';
        inspAttrs.innerHTML = attrs.map(a => `<span class="tag">${typeof a === 'string' ? a : (a.name || a.key)}</span>`).join('');
      } else {
        inspAttrsSection.style.display = 'none';
      }

      const formulas = nodeRaw.formulas || [];
      if (formulas.length > 0) {
        inspFormulasSection.style.display = 'block';
        inspFormulas.innerHTML = formulas.map(f => `<div class="formula-tag">${typeof f === 'string' ? f : (f.name || f.expression)}</div>`).join('');
      } else {
        inspFormulasSection.style.display = 'none';
      }

      inspector.classList.add('open');
    }

    inspClose.onclick = () => {
      inspector.classList.remove('open');
      network.unselectAll();
      try {
        window.parent.postMessage({ type: 'NODE_DESELECTED' }, '*');
      } catch(e) {}
    };

    // Network Selection Events
    network.on('selectNode', function(params) {
      if (params.nodes && params.nodes.length > 0) {
        const nodeId = params.nodes[0];
        const vNode = nodesDataset.get(nodeId);
        if (vNode && vNode.raw) {
          showDetails(vNode.raw);
          try {
            window.parent.postMessage({
              type: 'NODE_SELECTED',
              key: nodeId,
              name: vNode.label,
              node: vNode.raw
            }, '*');
          } catch(e) {}
        }
      }
    });

    network.on('deselectNode', function(params) {
      if (!params.nodes || params.nodes.length === 0) {
        inspector.classList.remove('open');
        try {
          window.parent.postMessage({ type: 'NODE_DESELECTED' }, '*');
        } catch(e) {}
      }
    });

    // Toolbar handlers
    document.getElementById('btn-fit').onclick = () => {
      network.fit({ animation: { duration: 600, easingFunction: 'easeInOutQuad' } });
    };

    document.getElementById('btn-zoom-in').onclick = () => {
      const scale = network.getScale() * 1.3;
      network.moveTo({ scale: scale, animation: { duration: 300 } });
    };

    document.getElementById('btn-zoom-out').onclick = () => {
      const scale = network.getScale() * 0.7;
      network.moveTo({ scale: scale, animation: { duration: 300 } });
    };

    let physicsEnabled = true;
    const physicsBtn = document.getElementById('btn-physics');
    physicsBtn.onclick = () => {
      physicsEnabled = !physicsEnabled;
      network.setOptions({ physics: { enabled: physicsEnabled } });
      physicsBtn.classList.toggle('active', physicsEnabled);
    };

    // Settle physics after initial stabilization
    network.once('stabilizationIterationsDone', function() {
      network.fit({ animation: { duration: 500 } });
      // Gently turn off continuous physics to save CPU
      setTimeout(() => {
        network.setOptions({ physics: { enabled: false } });
        physicsBtn.classList.remove('active');
        physicsEnabled = false;
      }, 1200);
    });

    // Listen to messages from React Parent
    window.addEventListener('message', function(event) {
      const data = event.data;
      if (!data) return;

      if (data.type === 'SELECT_NODE' && data.key) {
        network.selectNodes([data.key]);
        network.focus(data.key, { scale: 1.15, animation: { duration: 600, easingFunction: 'easeInOutQuad' } });
        const vNode = nodesDataset.get(data.key);
        if (vNode && vNode.raw) {
          showDetails(vNode.raw);
        }
      } else if (data.type === 'DESELECT_NODE') {
        network.unselectAll();
        inspector.classList.remove('open');
      } else if (data.type === 'FIT_GRAPH') {
        network.fit({ animation: { duration: 600 } });
      }
    });

    // Notify parent window that graph is ready
    window.parent.postMessage({ type: 'GRAPH_READY', slug: 'planning-budgeting-forecasting' }, '*');
  </script>
</body>
</html>
