<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #FFFFFF 0%, #F1F5F9 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #0F172A;
      user-select: none;
    }
    #network-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    /* Top Toolbar */
    .toolbar {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 12px;
      padding: 6px;
      z-index: 20;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }
    .tool-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #475569;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .tool-btn:hover {
      background: rgba(241, 245, 249, 0.95);
      color: #0F172A;
      border-color: #CBD5E1;
    }
    .tool-btn.active {
      background: rgba(59, 130, 246, 0.12);
      color: #2563EB;
      border-color: rgba(59, 130, 246, 0.35);
    }
    /* Floating Domain Badge */
    .domain-badge {
      position: absolute;
      top: 16px;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 12px;
      padding: 8px 14px;
      z-index: 20;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }
    .domain-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #C05A9E;
      box-shadow: 0 0 8px #C05A9E;
    }
    .domain-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #0F172A;
    }
    .domain-stats {
      font-size: 11px;
      color: #64748B;
      margin-left: 4px;
    }
    /* Legend */
    .legend {
      position: absolute;
      bottom: 16px;
      left: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-width: 60%;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 12px;
      padding: 8px 12px;
      z-index: 20;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #334155;
      font-weight: 500;
    }
    .legend-color {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    /* Node Info Overlay */
    .inspector {
      position: absolute;
      bottom: 16px;
      right: 16px;
      width: 320px;
      max-height: 280px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(226, 232, 240, 0.95);
      border-radius: 14px;
      padding: 14px;
      z-index: 20;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.12);
      display: none;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      transition: opacity 0.2s ease;
    }
    .inspector.open {
      display: flex;
    }
    .inspector-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid #E2E8F0;
      padding-bottom: 8px;
    }
    .inspector-title {
      font-size: 14px;
      font-weight: 700;
      color: #0F172A;
    }
    .inspector-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      background: #EFF6FF;
      color: #1D4ED8;
      border: 1px solid #DBEAFE;
    }
    .inspector-close {
      background: transparent;
      border: none;
      color: #94A3B8;
      font-size: 16px;
      cursor: pointer;
      line-height: 1;
    }
    .inspector-close:hover {
      color: #0F172A;
    }
    .inspector-def {
      font-size: 11px;
      line-height: 1.5;
      color: #475569;
    }
    .inspector-section {
      margin-top: 4px;
    }
    .inspector-subtitle {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748B;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .tag {
      background: #F1F5F9;
      border: 1px solid #E2E8F0;
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 10px;
      color: #334155;
      font-family: 'JetBrains Mono', monospace;
    }
    .formula-tag {
      background: #ECFDF5;
      border: 1px solid #A7F3D0;
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 10px;
      color: #065F46;
      font-family: 'JetBrains Mono', monospace;
      width: 100%;
      margin-bottom: 4px;
    }
  </style>
</head>

  </div>

  <script type="text/javascript">
    const rawNodes = [{"key": "abc", "name": "ABC / TD-ABC", "ref_name": "ABC / TD-ABC", "group_key": "f3", "group_name": "F3 Cost & Profitability", "color": "#C05A9E", "kind": "domain", "role": "core", "definition": "Two-stage activity-based costing (cost drivers trace input costs into pools, pools into cost objects) with worked driver rates (set-up per run, receiving per receipt, packing per delivery, engineering per order, machine-hour); time-driven variant uses duration drivers ('far more accurate than transaction drivers') and capacity cost rates. Connects with CostingAllocationModel and IdleCapacity & Resp. Centers.", "attributes": ["costPools[]", "driverRates (worked)", "timeEquations", "capacityCostRate"], "formulas": [], "evidence": "Worked ABC examples; TD-ABC references in costing landing.", "notes": null, "origin": "reference", "change_state": "unchanged", "added_in_version": 0}, {"key": "chargeback", "name": "SharedServices Chargeback", "ref_name": "SharedServices Chargeback", "group_key": "f3", "group_name": "F3 Cost & Profitability", "color": "#C05A9E", "kind": "domain", "role": "core", "definition": "Two chargeback methodologies: (1) allocate actual expenses \u2014 no recovery variance; (2) standard/negotiated activity price \u2014 provider becomes a profit center with recovery variance. Allocation models: waterfall, recursive, reciprocal; ABC results posted to GL at month-end.", "attributes": ["methodology (1|2)", "allocationModel", "recoveryVariance", "glPosting"], "formulas": [], "evidence": "Shared-services costing white papers; bank shared-services re-engineering (recursive \u2192 reciprocal).", "notes": null, "origin": "reference", "change_state": "unchanged", "added_in_version": 0}, {"key": "costing", "name": "CostingAllocationModel", "ref_name": "CostingAllocationModel", "group_key": "f3", "group_name": "F3 Cost & Profitability", "color": "#C05A9E", "kind": "domain", "role": "core", "definition": "The formal costing machinery beneath profitability: technique choice (standard \u00b7 marginal vs absorption \u00b7 ABC \u00b7 TD-ABC \u00b7 job/batch/process), the cost build-up ladder Prime Cost \u2192 Works Cost \u2192 COGM \u2192 COGS \u2192 Cost of Sale, and absorption mechanics (FOAR = budgeted overhead / budgeted normal activity; over/under-recovery).", "attributes": ["costingTechnique", "costBuildUpLadder", "foarFormula (verbatim)", "overUnderRecovery", "marginalVsAbsorptionRecon", "allocationComplexity"], "formulas": ["FOAR = budgeted overhead / budgeted normal activity"], "evidence": "Professional-accounting-body costing guides (>70% of UK manufacturers use standard costing); FPM costing framework.", "notes": null, "origin": "reference", "change_state": "modified", "added_in_version": 0}, {"key": "cts", "name": "CostToServe Model", "ref_name": "CostToServe Model", "group_key": "f3", "group_name": "F3 Cost & Profitability", "color": "#C05A9E", "kind": "domain", "role": "core", "definition": "The CPG cost-to-serve reference: supply-chain model per customer (Warehoused / Cross-Dock / Direct-Store-Delivery), warehouse activities with UoM drivers (#cases unloading, case-days storage, labour-hours pick&pack, case-km ship-to-customer), customer characteristics (order variability, avg order size, credit period).", "attributes": ["scModelPerCustomer", "warehouseActivityDrivers[]", "ctsCustomerCharacteristics", "allocationComplexity"], "formulas": [], "evidence": "FPM profitability & cost-management offering; product & customer profitability proposal.", "notes": null, "origin": "reference", "change_state": "unchanged", "added_in_version": 0}, {"key": "custdim", "name": "Customer / Channel", "ref_name": "Customer / Channel", "group_key": "spine", "group_name": "Finance master-data spine", "color": "#5A8AC3", "kind": "spine", "role": "shared", "definition": "Customer \u2192 key account \u2192 channel \u2192 route-to-market hierarchy; the other axis of profitability, cost-to-serve and credit exposure.", "attributes": ["customerId", "keyAccount", "channel", "rtmModel", "creditTerms", "supplyChainModel"], "formulas": [], "evidence": "Canon \u00a72.0/\u00a72.42/\u00a72.43.", "notes": null, "origin": "reference", "change_state": "unchanged", "added_in_version": 0}, {"key": "idlecap", "name": "IdleCapacity & Resp. Centers", "ref_name": "IdleCapacity & Resp. Centers", "group_key": "f3", "group_name": "F3 Cost & Profitability", "color": "#C05A9E", "kind": "domain", "role": "core", "definition": "Practical-capacity rates expose unallocated (idle) capacity cost instead of burying it in product costs; responsibility-center taxonomy types every org node for what it can be held accountable for.", "attributes": ["practicalCapacityRate", "idleCapacityCost", "responsibilityCenterType"], "formulas": [], "evidence": "Canon \u00a72.54; TD-ABC capacity references.", "notes": null, "origin": "reference", "change_state": "unchanged", "added_in_version": 0}, {"key": "orgnode", "name": "OrganizationNode", "ref_name": "OrganizationNode", "group_key": "spine", "group_name": "Finance master-data spine", "color": "#5A8AC3", "kind": "spine", "role": "shared", "definition": "Legal entity \u2192 business unit \u2192 function \u2192 cost/profit/investment center \u2192 role. Responsibility-center taxonomy (profit / investment / standard-cost / discretionary-expense / revenue) types each node for control purposes; DOA and SOD hang off it.", "attributes": ["entityId", "parent", "centerType", "currency", "doaLevel", "sharedServiceFlag", "consolidationScope"], "formulas": [], "evidence": "Canon \u00a72.0/\u00a72.44/\u00a72.54; consolidation scoping decks.", "notes": null, "origin": "reference", "change_state": "unchanged", "added_in_version": 0}, {"key": "proddim", "name": "Product / SKU", "ref_name": "Product / SKU", "group_key": "spine", "group_name": "Finance master-data spine", "color": "#5A8AC3", "kind": "spine", "role": "shared", "definition": "Category \u2192 brand \u2192 MPG \u2192 size \u2192 SKU hierarchy \u2014 the grain of customer\u00d7SKU profitability, granularity matrices and cost objects.", "attributes": ["sku", "brand", "mpg", "size", "category", "statCaseFactor", "mpcFactor"], "formulas": [], "evidence": "Canon \u00a72.0; HPC-major granularity matrix.", "notes": null, "origin": "reference", "change_state": "unchanged", "added_in_version": 0}, {"key": "profitability", "name": "ProfitabilityRecord", "ref_name": "ProfitabilityRecord", "group_key": "f3", "group_name": "F3 Cost & Profitability", "color": "#C05A9E", "kind": "domain", "role": "core", "definition": "Customer\u00d7SKU P&L at customer \u00d7 brand/MPG \u00d7 size \u00d7 month, COPA-extended: full G2N to marketing profit with allocation logic (mfg OH on planned volume, warehousing on net weight shipped, variances on DMC@std), TPM liability reconciliation, and the CPP margin ladder materialMargin \u2192 contributionMargin \u2192 plantMargin.", "attributes": ["grain (cust\u00d7SKU\u00d7month)", "allocationLogic", "tpmLiabilityRecon", "marginLadder", "whaleCurve"], "formulas": [], "evidence": "HPC-major customer-profitability reference; nutrition-group CPP; dairy-cooperative EPM.", "notes": null, "origin": "reference", "change_state": "unchanged", "added_in_version": 0}, {"key": "stdcost", "name": "StandardCosting & Variances", "ref_name": "StandardCosting & Variances", "group_key": "f3", "group_name": "F3 Cost & Profitability", "color": "#C05A9E", "kind": "domain", "role": "core", "definition": "4-element control loop (set standards \u2192 compare \u2192 analyse & report \u2192 investigate & act; 'management by exception') with the full variance taxonomy: material price/usage (+mix & yield), labour rate/efficiency, variable-OH expenditure/efficiency, fixed-OH expenditure/volume, sales variances in contribution terms, planning vs operational split.", "attributes": ["standardType", "varianceTaxonomy[]", "mixYieldSubVariances", "planningVsOperational"], "formulas": [], "evidence": "Professional-body variance method (verbatim formulas in detail file).", "notes": null, "origin": "reference", "change_state": "unchanged", "added_in_version": 0}, {"key": "truemargin", "name": "TrueMargin Waterfall", "ref_name": "TrueMargin Waterfall", "group_key": "f3", "group_name": "F3 Cost & Profitability", "color": "#C05A9E", "kind": "domain", "role": "core", "definition": "The profitability waterfall extended past net margin to trueMargin = net margin less financial elements (inventory-blockage cost, A/R-blockage cost, opportunity costs) \u2014 paired with the whale curve to expose the cumulative-profitability inflection, and the 12-component cost-classification matrix.", "attributes": ["trueMarginFormula", "financialElements[]", "whaleInflection", "costClassificationMatrix (12\u00d75)"], "formulas": ["trueMargin = net margin less financial elements (inventory-blockage cost, A/R-blockage cost, opportunity costs)"], "evidence": "Canon \u00a72.42 v1.1 extension.", "notes": null, "origin": "reference", "change_state": "unchanged", "added_in_version": 0}];
    const rawEdges = [{"source": "proddim", "target": "profitability", "label": "SKU grain", "origin": "reference", "change_state": "unchanged", "added_in_version": 0, "cross_domain": false}, {"source": "custdim", "target": "profitability", "label": "customer grain", "origin": "reference", "change_state": "unchanged", "added_in_version": 0, "cross_domain": false}, {"source": "orgnode", "target": "chargeback", "label": "provider/consumer", "origin": "reference", "change_state": "unchanged", "added_in_version": 0, "cross_domain": false}, {"source": "costing", "target": "profitability", "label": "allocates into", "origin": "reference", "change_state": "unchanged", "added_in_version": 0, "cross_domain": false}, {"source": "stdcost", "target": "costing", "label": "variance discipline", "origin": "reference", "change_state": "unchanged", "added_in_version": 0, "cross_domain": false}, {"source": "abc", "target": "costing", "label": "technique of", "origin": "reference", "change_state": "unchanged", "added_in_version": 0, "cross_domain": false}, {"source": "cts", "target": "profitability", "label": "extends to customer", "origin": "reference", "change_state": "unchanged", "added_in_version": 0, "cross_domain": false}, {"source": "profitability", "target": "truemargin", "label": "extends to", "origin": "reference", "change_state": "unchanged", "added_in_version": 0, "cross_domain": false}, {"source": "chargeback", "target": "costing", "label": "charges via", "origin": "reference", "change_state": "unchanged", "added_in_version": 0, "cross_domain": false}, {"source": "idlecap", "target": "abc", "label": "capacity rates", "origin": "reference", "change_state": "unchanged", "added_in_version": 0, "cross_domain": false}];

    // Build Legend
    const legendEl = document.getElementById('legend');
    const groupMap = new Map();
    rawNodes.forEach(n => {
      if (n.group_name && !groupMap.has(n.group_name)) {
        groupMap.set(n.group_name, n.color || '#C05A9E');
      }
    });
    groupMap.forEach((color, name) => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<span class="legend-color" style="background:${color};box-shadow:0 0 6px ${color}"></span><span>${name}</span>`;
      legendEl.appendChild(item);
    });

    // Transform Nodes for Vis.js (White / Light Theme)
    const visNodes = rawNodes.map(n => {
      const nodeColor = n.color || '#C05A9E';
      return {
        id: n.key,
        label: n.name,
        group: n.group_name,
        color: {
          background: '#FFFFFF',
          border: nodeColor,
          highlight: {
            background: '#F0F9FF',
            border: nodeColor
          },
          hover: {
            background: '#F8FAFC',
            border: nodeColor
          }
        },
        font: {
          color: '#0F172A',
          size: 13,
          face: 'Inter, sans-serif',
          bold: true
        },
        shape: 'box',
        margin: 12,
        borderWidth: 2,
        borderWidthSelected: 3,
        shadow: {
          enabled: true,
          color: 'rgba(0, 0, 0, 0.08)',
          size: 8,
          x: 1,
          y: 3
        },
        raw: n
      };
    });

    // Transform Edges for Vis.js (White / Light Theme)
    const visEdges = rawEdges.map((e, idx) => {
      return {
        id: 'e_' + idx,
        from: e.source,
        to: e.target,
        label: e.label || '',
        arrows: {
          to: {
            enabled: true,
            scaleFactor: 0.8
          }
        },
        color: {
          color: '#94A3B8',
          highlight: '#2563EB',
          hover: '#64748B'
        },
        font: {
          color: '#475569',
          size: 11,
          face: 'Inter, sans-serif',
          align: 'middle',
          background: 'rgba(255, 255, 255, 0.95)'
        },
        smooth: {
          type: 'curvedCW',
          roundness: 0.2
        },
        length: 220
      };
    });

    const container = document.getElementById('network-container');
    const nodesDataset = new vis.DataSet(visNodes);
    const edgesDataset = new vis.DataSet(visEdges);

    const data = {
      nodes: nodesDataset,
      edges: edgesDataset
    };

    const options = {
      physics: {
        enabled: true,
        solver: 'forceAtlas2Based',
        forceAtlas2Based: {
          gravitationalConstant: -50,
          centralGravity: 0.01,
          springLength: 160,
          springConstant: 0.08,
          damping: 0.4
        },
        stabilization: {
          iterations: 160,
          updateInterval: 25
        }
      },
      interaction: {
        hover: true,
        tooltipDelay: 150,
        selectable: true,
        multiselect: false,
        navigationButtons: false,
        zoomView: true,
        dragView: true
      }
    };

    const network = new vis.Network(container, data, options);

    // Inspector elements
    const inspector = document.getElementById('inspector');
    const inspName = document.getElementById('insp-name');
    const inspGroup = document.getElementById('insp-group');
    const inspDef = document.getElementById('insp-def');
    const inspAttrs = document.getElementById('insp-attrs');
    const inspAttrsSection = document.getElementById('insp-attrs-section');
    const inspFormulas = document.getElementById('insp-formulas');
    const inspFormulasSection = document.getElementById('insp-formulas-section');
    const inspClose = document.getElementById('insp-close');

    function showDetails(nodeRaw) {
      if (!nodeRaw) {
        inspector.classList.remove('open');
        return;
      }
      inspName.textContent = nodeRaw.name || nodeRaw.key;
      inspGroup.textContent = nodeRaw.group_name || 'Cost and Profitability Management';
      inspDef.textContent = nodeRaw.definition || 'No definition available.';

      const attrs = nodeRaw.attributes || [];
      if (attrs.length > 0) {
        inspAttrsSection.style.display = 'block';
        inspAttrs.innerHTML = attrs.map(a => `<span class="tag">${typeof a === 'string' ? a : (a.name || a.key)}</span>`).join('');
      } else {
        inspAttrsSection.style.display = 'none';
      }

      const formulas = nodeRaw.formulas || [];
      if (formulas.length > 0) {
        inspFormulasSection.style.display = 'block';
        inspFormulas.innerHTML = formulas.map(f => `<div class="formula-tag">${typeof f === 'string' ? f : (f.name || f.expression)}</div>`).join('');
      } else {
        inspFormulasSection.style.display = 'none';
      }

      inspector.classList.add('open');
    }

    inspClose.onclick = () => {
      inspector.classList.remove('open');
      network.unselectAll();
      try {
        window.parent.postMessage({ type: 'NODE_DESELECTED' }, '*');
      } catch(e) {}
    };

    // Network Selection Events
    network.on('selectNode', function(params) {
      if (params.nodes && params.nodes.length > 0) {
        const nodeId = params.nodes[0];
        const vNode = nodesDataset.get(nodeId);
        if (vNode && vNode.raw) {
          showDetails(vNode.raw);
          try {
            window.parent.postMessage({
              type: 'NODE_SELECTED',
              key: nodeId,
              name: vNode.label,
              node: vNode.raw
            }, '*');
          } catch(e) {}
        }
      }
    });

    network.on('deselectNode', function(params) {
      if (!params.nodes || params.nodes.length === 0) {
        inspector.classList.remove('open');
        try {
          window.parent.postMessage({ type: 'NODE_DESELECTED' }, '*');
        } catch(e) {}
      }
    });

    // Toolbar handlers
    document.getElementById('btn-fit').onclick = () => {
      network.fit({ animation: { duration: 600, easingFunction: 'easeInOutQuad' } });
    };

    document.getElementById('btn-zoom-in').onclick = () => {
      const scale = network.getScale() * 1.3;
      network.moveTo({ scale: scale, animation: { duration: 300 } });
    };

    document.getElementById('btn-zoom-out').onclick = () => {
      const scale = network.getScale() * 0.7;
      network.moveTo({ scale: scale, animation: { duration: 300 } });
    };

    let physicsEnabled = true;
    const physicsBtn = document.getElementById('btn-physics');
    physicsBtn.onclick = () => {
      physicsEnabled = !physicsEnabled;
      network.setOptions({ physics: { enabled: physicsEnabled } });
      physicsBtn.classList.toggle('active', physicsEnabled);
    };

    // Settle physics after initial stabilization
    network.once('stabilizationIterationsDone', function() {
      network.fit({ animation: { duration: 500 } });
      // Gently turn off continuous physics to save CPU
      setTimeout(() => {
        network.setOptions({ physics: { enabled: false } });
        physicsBtn.classList.remove('active');
        physicsEnabled = false;
      }, 1200);
    });

    // Listen to messages from React Parent
    window.addEventListener('message', function(event) {
      const data = event.data;
      if (!data) return;

      if (data.type === 'SELECT_NODE' && data.key) {
        network.selectNodes([data.key]);
        network.focus(data.key, { scale: 1.15, animation: { duration: 600, easingFunction: 'easeInOutQuad' } });
        const vNode = nodesDataset.get(data.key);
        if (vNode && vNode.raw) {
          showDetails(vNode.raw);
        }
      } else if (data.type === 'DESELECT_NODE') {
        network.unselectAll();
        inspector.classList.remove('open');
      } else if (data.type === 'FIT_GRAPH') {
        network.fit({ animation: { duration: 600 } });
      }
    });

    // Notify parent window that graph is ready
    window.parent.postMessage({ type: 'GRAPH_READY', slug: 'cost-profitability-management' }, '*');
  </script>
</body>
</html>
