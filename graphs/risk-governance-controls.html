<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Risk, Governance and Controls — Knowledge Graph</title>
  <script type="text/javascript" src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #FFFFFF 0%, #F1F5F9 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #0F172A;
      user-select: none;
    }
    #network-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    /* Top Toolbar */
    .toolbar {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 12px;
      padding: 6px;
      z-index: 20;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }
    .tool-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #475569;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .tool-btn:hover {
      background: rgba(241, 245, 249, 0.95);
      color: #0F172A;
      border-color: #CBD5E1;
    }
    .tool-btn.active {
      background: rgba(59, 130, 246, 0.12);
      color: #2563EB;
      border-color: rgba(59, 130, 246, 0.35);
    }
    /* Floating Domain Badge */
    .domain-badge {
      position: absolute;
      top: 16px;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 12px;
      padding: 8px 14px;
      z-index: 20;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }
    .domain-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #C2503E;
      box-shadow: 0 0 8px #C2503E;
    }
    .domain-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #0F172A;
    }
    .domain-stats {
      font-size: 11px;
      color: #64748B;
      margin-left: 4px;
    }
    /* Legend */
    .legend {
      position: absolute;
      bottom: 16px;
      left: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-width: 60%;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 12px;
      padding: 8px 12px;
      z-index: 20;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #334155;
      font-weight: 500;
    }
    .legend-color {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    /* Node Info Overlay */
    .inspector {
      position: absolute;
      bottom: 16px;
      right: 16px;
      width: 320px;
      max-height: 280px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(226, 232, 240, 0.95);
      border-radius: 14px;
      padding: 14px;
      z-index: 20;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.12);
      display: none;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      transition: opacity 0.2s ease;
    }
    .inspector.open {
      display: flex;
    }
    .inspector-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid #E2E8F0;
      padding-bottom: 8px;
    }
    .inspector-title {
      font-size: 14px;
      font-weight: 700;
      color: #0F172A;
    }
    .inspector-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      background: #EFF6FF;
      color: #1D4ED8;
      border: 1px solid #DBEAFE;
    }
    .inspector-close {
      background: transparent;
      border: none;
      color: #94A3B8;
      font-size: 16px;
      cursor: pointer;
      line-height: 1;
    }
    .inspector-close:hover {
      color: #0F172A;
    }
    .inspector-def {
      font-size: 11px;
      line-height: 1.5;
      color: #475569;
    }
    .inspector-section {
      margin-top: 4px;
    }
    .inspector-subtitle {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748B;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .tag {
      background: #F1F5F9;
      border: 1px solid #E2E8F0;
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 10px;
      color: #334155;
      font-family: 'JetBrains Mono', monospace;
    }
    .formula-tag {
      background: #ECFDF5;
      border: 1px solid #A7F3D0;
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 10px;
      color: #065F46;
      font-family: 'JetBrains Mono', monospace;
      width: 100%;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div id="network-container"></div>

  <!-- Domain Header -->
  <div class="domain-badge">
    <div class="domain-dot"></div>
    <span class="domain-title">Risk, Governance and Controls</span>
    <span class="domain-stats">(9 nodes &middot; 10 edges)</span>
  </div>

  <!-- Action Controls -->
  <div class="toolbar">
    <button class="tool-btn" id="btn-fit" title="Fit to Screen">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
      Fit
    </button>
    <button class="tool-btn" id="btn-zoom-in" title="Zoom In">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    </button>
    <button class="tool-btn" id="btn-zoom-out" title="Zoom Out">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    </button>
    <button class="tool-btn active" id="btn-physics" title="Toggle Physics">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      Physics
    </button>
  </div>

  <!-- Groups Legend -->
  <div class="legend" id="legend"></div>

  <!-- Inspector Card -->
  <div class="inspector" id="inspector">
    <div class="inspector-header">
      <div>
        <div class="inspector-title" id="insp-name">Entity</div>
        <div class="inspector-badge" id="insp-group">Group</div>
      </div>
      <button class="inspector-close" id="insp-close">&times;</button>
    </div>
    <div class="inspector-def" id="insp-def"></div>
    <div class="inspector-section" id="insp-attrs-section">
      <div class="inspector-subtitle">Attributes</div>
      <div class="tag-container" id="insp-attrs"></div>
    </div>
    <div class="inspector-section" id="insp-formulas-section">
      <div class="inspector-subtitle">Key Calculation Formulas</div>
      <div id="insp-formulas"></div>
    </div>
  </div>

  <script type="text/javascript">
    const rawNodes = [{"key": "doa", "name": "DOA / SOD Matrices", "group_key": "f7", "group_name": "F7 Risk, Governance & Controls", "color": "#C2503E", "kind": "domain", "role": "core", "definition": "Delegation-of-authority thresholds per org node and segregation-of-duties rules (e.g. invoice processor \u00e2\u2030\u00a0 vendor-master access \u00e2\u2030\u00a0 payments) \u2014 the control grid every approval-bearing process step must respect.", "attributes": ["doaThresholds", "sodRules (verbatim example)", "conflictMatrix"], "formulas": [], "origin": "reference", "change_state": "unchanged"}, {"key": "erm", "name": "EmergingRisk / ERM", "group_key": "f7", "group_name": "F7 Risk, Governance & Controls", "color": "#C2503E", "kind": "domain", "role": "core", "definition": "Forward-looking risk radar with scenario analysis and stress testing \u2014 the enterprise layer above process controls, feeding board risk appetite and the audit plan.", "attributes": ["riskRadar", "scenarioAnalysis", "stressTesting", "riskAppetite"], "formulas": [], "origin": "reference", "change_state": "unchanged"}, {"key": "fraudmode", "name": "RiskAnalyticsMode", "group_key": "f7", "group_name": "F7 Risk, Governance & Controls", "color": "#C2503E", "kind": "domain", "role": "core", "definition": "Traditional 25-sample periodic audit \u2192 analytical 100%-population anomaly screening with continuous-monitoring dashboards. Collusion statistics: 42% of frauds are collusive; 100% of financial-statement frauds are collusive \u2014 sampling cannot see them.", "attributes": ["modeShift (25\u2192100%)", "anomalyScreens", "continuousMonitoring", "collusionStats (verbatim)"], "formulas": [], "origin": "reference", "change_state": "unchanged"}, {"key": "kri", "name": "KRI Repository & P2P KPIs", "group_key": "f7", "group_name": "F7 Risk, Governance & Controls", "color": "#C2503E", "kind": "domain", "role": "core", "definition": "Key-risk-indicator inventory including the 11 verbatim P2P KPIs \u2014 Purchase Price Variance, POs-just-below-approval-limit, vendor turnover, duplicate payments and peers \u2014 each a named early-warning metric with an owner.", "attributes": ["kriName", "threshold", "owner", "p2pKpiSet (11 verbatim)"], "formulas": [], "origin": "reference", "change_state": "unchanged"}, {"key": "metricdef", "name": "MetricDefinition", "group_key": "spine", "group_name": "Finance master-data spine", "color": "#5A8AC3", "kind": "spine", "role": "shared", "definition": "Governed KPI dictionary: every finance metric carries a verbatim formula, grain, source, owning role and RAG thresholds \u2014 the rationalization benchmark is 400 \u2192 30 metrics.", "attributes": ["metricName", "formula (verbatim)", "uom", "timeGrains[]", "owningRole", "ragThresholds", "leadLagClass", "nonAggregationRule"], "formulas": [], "origin": "reference", "change_state": "unchanged"}, {"key": "orgnode", "name": "OrganizationNode", "group_key": "spine", "group_name": "Finance master-data spine", "color": "#5A8AC3", "kind": "spine", "role": "shared", "definition": "Legal entity \u2192 business unit \u2192 function \u2192 cost/profit/investment center \u2192 role. Responsibility-center taxonomy (profit / investment / standard-cost / discretionary-expense / revenue) types each node for control purposes; DOA and SOD hang off it.", "attributes": ["entityId", "parent", "centerType", "currency", "doaLevel", "sharedServiceFlag", "consolidationScope"], "formulas": [], "origin": "reference", "change_state": "unchanged"}, {"key": "p2ppolicy", "name": "P2P Policy Anatomy", "group_key": "f7", "group_name": "F7 Risk, Governance & Controls", "color": "#C2503E", "kind": "domain", "role": "core", "definition": "The worked procure-to-pay policy artifact: header/versions/approvals \u2192 objectives \u2192 chapters vendor-onboarding\u2192payment \u2192 procedure step tables \u2192 SLA table \u2192 KPI table \u2192 authority-matrix annexures. Verbatim thresholds: quotation ladder 1/2/3 quotes by value band; 3-way match Invoice = GRN \u00e2\u2030\u00a4 PO with zero price margin; monthly open-PO dispositions; duplicate-vendor checks on trade-license/IBAN; 7-criteria weighted vendor rating.", "attributes": ["policyAnatomy", "quotationLadder (verbatim)", "threeWayMatch (verbatim)", "vendorRating (7 criteria)", "openPoDisposition"], "formulas": ["3-way match Invoice = GRN \u00e2\u2030\u00a4 PO"], "origin": "reference", "change_state": "unchanged"}, {"key": "riskctrl", "name": "RiskControlFramework", "group_key": "f7", "group_name": "F7 Risk, Governance & Controls", "color": "#C2503E", "kind": "domain", "role": "core", "definition": "The governance spine: control environment ('tone at the top') \u00b7 risk assessment (likelihood \u00d7 impact \u00d7 controllability) \u00b7 risk response (avoid/accept/mitigate/share) \u00b7 control activities (policies = principles, procedures = steps; preventive/detective balance) \u00b7 information & communication \u00b7 monitoring (design vs operating effectiveness).", "attributes": ["controlComponents[] (6)", "assertionChecks", "preventiveDetectiveBalance", "effectivenessTests"], "formulas": [], "origin": "reference", "change_state": "unchanged"}, {"key": "riskuniv", "name": "Risk & Control Universe", "group_key": "f7", "group_name": "F7 Risk, Governance & Controls", "color": "#C2503E", "kind": "domain", "role": "core", "definition": "Process \u2192 sub-process \u2192 risks (fraud-flagged) \u2192 controls \u2192 % operating effectively \u2014 the navigable inventory that risk analytics and audit planning run on.", "attributes": ["processTree", "riskRegister (fraudFlag)", "controlMap", "pctOperatingEffectively"], "formulas": [], "origin": "reference", "change_state": "unchanged"}];
    const rawEdges = [{"source": "metricdef", "target": "kri", "label": "governs", "origin": "reference", "change_state": "unchanged", "cross_domain": false, "origin_graph": "finance-graph"}, {"source": "orgnode", "target": "doa", "label": "authority per node", "origin": "reference", "change_state": "unchanged", "cross_domain": false, "origin_graph": "finance-graph"}, {"source": "riskctrl", "target": "riskuniv", "label": "populates", "origin": "reference", "change_state": "unchanged", "cross_domain": false, "origin_graph": "finance-graph"}, {"source": "riskctrl", "target": "doa", "label": "mandates", "origin": "reference", "change_state": "unchanged", "cross_domain": false, "origin_graph": "finance-graph"}, {"source": "p2ppolicy", "target": "doa", "label": "embeds", "origin": "reference", "change_state": "unchanged", "cross_domain": false, "origin_graph": "finance-graph"}, {"source": "p2ppolicy", "target": "kri", "label": "defines KPIs", "origin": "reference", "change_state": "unchanged", "cross_domain": false, "origin_graph": "finance-graph"}, {"source": "riskuniv", "target": "fraudmode", "label": "screened by", "origin": "reference", "change_state": "unchanged", "cross_domain": false, "origin_graph": "finance-graph"}, {"source": "erm", "target": "riskctrl", "label": "enterprise layer", "origin": "reference", "change_state": "unchanged", "cross_domain": false, "origin_graph": "finance-graph"}, {"source": "fraudmode", "target": "p2ppolicy", "label": "monitors compliance", "origin": "reference", "change_state": "unchanged", "cross_domain": false, "origin_graph": "finance-graph"}, {"source": "riskctrl", "target": "metricdef", "label": "KRIs & P2P KPIs", "origin": "reference", "change_state": "unchanged", "cross_domain": false, "origin_graph": "industry-graph"}];

    // Build Legend
    const legendEl = document.getElementById('legend');
    const groupMap = new Map();
    rawNodes.forEach(n => {
      if (n.group_name && !groupMap.has(n.group_name)) {
        groupMap.set(n.group_name, n.color || '#C2503E');
      }
    });
    groupMap.forEach((color, name) => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<span class="legend-color" style="background:${color};box-shadow:0 0 6px ${color}"></span><span>${name}</span>`;
      legendEl.appendChild(item);
    });

    // Transform Nodes for Vis.js (White / Light Theme)
    const visNodes = rawNodes.map(n => {
      const nodeColor = n.color || '#C2503E';
      return {
        id: n.key,
        label: n.name,
        group: n.group_name,
        color: {
          background: '#FFFFFF',
          border: nodeColor,
          highlight: {
            background: '#F0F9FF',
            border: nodeColor
          },
          hover: {
            background: '#F8FAFC',
            border: nodeColor
          }
        },
        font: {
          color: '#0F172A',
          size: 13,
          face: 'Inter, sans-serif',
          bold: true
        },
        shape: 'box',
        margin: 12,
        borderWidth: 2,
        borderWidthSelected: 3,
        shadow: {
          enabled: true,
          color: 'rgba(0, 0, 0, 0.08)',
          size: 8,
          x: 1,
          y: 3
        },
        raw: n
      };
    });

    // Transform Edges for Vis.js (White / Light Theme)
    const visEdges = rawEdges.map((e, idx) => {
      return {
        id: 'e_' + idx,
        from: e.source,
        to: e.target,
        label: e.label || '',
        arrows: {
          to: {
            enabled: true,
            scaleFactor: 0.8
          }
        },
        color: {
          color: '#94A3B8',
          highlight: '#2563EB',
          hover: '#64748B'
        },
        font: {
          color: '#475569',
          size: 11,
          face: 'Inter, sans-serif',
          align: 'middle',
          background: 'rgba(255, 255, 255, 0.95)'
        },
        smooth: {
          type: 'curvedCW',
          roundness: 0.2
        },
        length: 220
      };
    });

    const container = document.getElementById('network-container');
    const nodesDataset = new vis.DataSet(visNodes);
    const edgesDataset = new vis.DataSet(visEdges);

    const data = {
      nodes: nodesDataset,
      edges: edgesDataset
    };

    const options = {
      physics: {
        enabled: true,
        solver: 'forceAtlas2Based',
        forceAtlas2Based: {
          gravitationalConstant: -50,
          centralGravity: 0.01,
          springLength: 160,
          springConstant: 0.08,
          damping: 0.4
        },
        stabilization: {
          iterations: 160,
          updateInterval: 25
        }
      },
      interaction: {
        hover: true,
        tooltipDelay: 150,
        selectable: true,
        multiselect: false,
        navigationButtons: false,
        zoomView: true,
        dragView: true
      }
    };

    const network = new vis.Network(container, data, options);

    // Inspector elements
    const inspector = document.getElementById('inspector');
    const inspName = document.getElementById('insp-name');
    const inspGroup = document.getElementById('insp-group');
    const inspDef = document.getElementById('insp-def');
    const inspAttrs = document.getElementById('insp-attrs');
    const inspAttrsSection = document.getElementById('insp-attrs-section');
    const inspFormulas = document.getElementById('insp-formulas');
    const inspFormulasSection = document.getElementById('insp-formulas-section');
    const inspClose = document.getElementById('insp-close');

    function showDetails(nodeRaw) {
      if (!nodeRaw) {
        inspector.classList.remove('open');
        return;
      }
      inspName.textContent = nodeRaw.name || nodeRaw.key;
      inspGroup.textContent = nodeRaw.group_name || 'Risk, Governance and Controls';
      inspDef.textContent = nodeRaw.definition || 'No definition available.';

      const attrs = nodeRaw.attributes || [];
      if (attrs.length > 0) {
        inspAttrsSection.style.display = 'block';
        inspAttrs.innerHTML = attrs.map(a => `<span class="tag">${typeof a === 'string' ? a : (a.name || a.key)}</span>`).join('');
      } else {
        inspAttrsSection.style.display = 'none';
      }

      const formulas = nodeRaw.formulas || [];
      if (formulas.length > 0) {
        inspFormulasSection.style.display = 'block';
        inspFormulas.innerHTML = formulas.map(f => `<div class="formula-tag">${typeof f === 'string' ? f : (f.name || f.expression)}</div>`).join('');
      } else {
        inspFormulasSection.style.display = 'none';
      }

      inspector.classList.add('open');
    }

    inspClose.onclick = () => {
      inspector.classList.remove('open');
      network.unselectAll();
      try {
        window.parent.postMessage({ type: 'NODE_DESELECTED' }, '*');
      } catch(e) {}
    };

    // Network Selection Events
    network.on('selectNode', function(params) {
      if (params.nodes && params.nodes.length > 0) {
        const nodeId = params.nodes[0];
        const vNode = nodesDataset.get(nodeId);
        if (vNode && vNode.raw) {
          showDetails(vNode.raw);
          try {
            window.parent.postMessage({
              type: 'NODE_SELECTED',
              key: nodeId,
              name: vNode.label,
              node: vNode.raw
            }, '*');
          } catch(e) {}
        }
      }
    });

    network.on('deselectNode', function(params) {
      if (!params.nodes || params.nodes.length === 0) {
        inspector.classList.remove('open');
        try {
          window.parent.postMessage({ type: 'NODE_DESELECTED' }, '*');
        } catch(e) {}
      }
    });

    // Toolbar handlers
    document.getElementById('btn-fit').onclick = () => {
      network.fit({ animation: { duration: 600, easingFunction: 'easeInOutQuad' } });
    };

    document.getElementById('btn-zoom-in').onclick = () => {
      const scale = network.getScale() * 1.3;
      network.moveTo({ scale: scale, animation: { duration: 300 } });
    };

    document.getElementById('btn-zoom-out').onclick = () => {
      const scale = network.getScale() * 0.7;
      network.moveTo({ scale: scale, animation: { duration: 300 } });
    };

    let physicsEnabled = true;
    const physicsBtn = document.getElementById('btn-physics');
    physicsBtn.onclick = () => {
      physicsEnabled = !physicsEnabled;
      network.setOptions({ physics: { enabled: physicsEnabled } });
      physicsBtn.classList.toggle('active', physicsEnabled);
    };

    // Settle physics after initial stabilization
    network.once('stabilizationIterationsDone', function() {
      network.fit({ animation: { duration: 500 } });
      // Gently turn off continuous physics to save CPU
      setTimeout(() => {
        network.setOptions({ physics: { enabled: false } });
        physicsBtn.classList.remove('active');
        physicsEnabled = false;
      }, 1200);
    });

    // Listen to messages from React Parent
    window.addEventListener('message', function(event) {
      const data = event.data;
      if (!data) return;

      if (data.type === 'SELECT_NODE' && data.key) {
        network.selectNodes([data.key]);
        network.focus(data.key, { scale: 1.15, animation: { duration: 600, easingFunction: 'easeInOutQuad' } });
        const vNode = nodesDataset.get(data.key);
        if (vNode && vNode.raw) {
          showDetails(vNode.raw);
        }
      } else if (data.type === 'DESELECT_NODE') {
        network.unselectAll();
        inspector.classList.remove('open');
      } else if (data.type === 'FIT_GRAPH') {
        network.fit({ animation: { duration: 600 } });
      }
    });

    // Notify parent window that graph is ready
    window.parent.postMessage({ type: 'GRAPH_READY', slug: 'risk-governance-controls' }, '*');
  </script>
</body>
</html>
