<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Management Reporting and Gross-to-Net — Knowledge Graph</title>
  <script type="text/javascript" src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #FFFFFF 0%, #F1F5F9 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #0F172A;
      user-select: none;
    }
    #network-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    /* Top Toolbar */
    .toolbar {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 12px;
      padding: 6px;
      z-index: 20;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }
    .tool-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #475569;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .tool-btn:hover {
      background: rgba(241, 245, 249, 0.95);
      color: #0F172A;
      border-color: #CBD5E1;
    }
    .tool-btn.active {
      background: rgba(59, 130, 246, 0.12);
      color: #2563EB;
      border-color: rgba(59, 130, 246, 0.35);
    }
    /* Floating Domain Badge */
    .domain-badge {
      position: absolute;
      top: 16px;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 12px;
      padding: 8px 14px;
      z-index: 20;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }
    .domain-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #8A4FD0;
      box-shadow: 0 0 8px #8A4FD0;
    }
    .domain-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #0F172A;
    }
    .domain-stats {
      font-size: 11px;
      color: #64748B;
      margin-left: 4px;
    }
    /* Legend */
    .legend {
      position: absolute;
      bottom: 16px;
      left: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-width: 60%;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 12px;
      padding: 8px 12px;
      z-index: 20;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #334155;
      font-weight: 500;
    }
    .legend-color {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    /* Node Info Overlay */
    .inspector {
      position: absolute;
      bottom: 16px;
      right: 16px;
      width: 320px;
      max-height: 280px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(226, 232, 240, 0.95);
      border-radius: 14px;
      padding: 14px;
      z-index: 20;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.12);
      display: none;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      transition: opacity 0.2s ease;
    }
    .inspector.open {
      display: flex;
    }
    .inspector-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid #E2E8F0;
      padding-bottom: 8px;
    }
    .inspector-title {
      font-size: 14px;
      font-weight: 700;
      color: #0F172A;
    }
    .inspector-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      background: #EFF6FF;
      color: #1D4ED8;
      border: 1px solid #DBEAFE;
    }
    .inspector-close {
      background: transparent;
      border: none;
      color: #94A3B8;
      font-size: 16px;
      cursor: pointer;
      line-height: 1;
    }
    .inspector-close:hover {
      color: #0F172A;
    }
    .inspector-def {
      font-size: 11px;
      line-height: 1.5;
      color: #475569;
    }
    .inspector-section {
      margin-top: 4px;
    }
    .inspector-subtitle {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748B;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .tag {
      background: #F1F5F9;
      border: 1px solid #E2E8F0;
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 10px;
      color: #334155;
      font-family: 'JetBrains Mono', monospace;
    }
    .formula-tag {
      background: #ECFDF5;
      border: 1px solid #A7F3D0;
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 10px;
      color: #065F46;
      font-family: 'JetBrains Mono', monospace;
      width: 100%;
      margin-bottom: 4px;
    }
  </style>
</head>

  </div>

  <script type="text/javascript">
    const rawNodes = [{"key": "account", "name": "Account / CoA", "ref_name": "Account / CoA", "group_key": "spine", "group_name": "Finance master-data spine", "color": "#5A8AC3", "kind": "spine", "role": "shared", "definition": "Chart-of-accounts dimension with account intelligence (account type, rate type, depreciation logic carried as attributes rather than separate hierarchies) \u2014 the 17-dimension planning reference model's anchor dimension.", "attributes": ["accountCode", "parent", "accountType", "rateType (avg/closing)", "signConvention", "rliMapping", "depreciationIntelligence", "accountName", "description", "currency", "activeStatus"], "formulas": [], "evidence": "17-dimension planning blueprint (wind-turbine manufacturer), beverage-major BPC dimension set.", "notes": null, "origin": "reference", "change_state": "unchanged", "added_in_version": 0}, {"key": "currency", "name": "Currency / FX", "ref_name": "Currency / FX", "group_key": "spine", "group_name": "Finance master-data spine", "color": "#5A8AC3", "kind": "spine", "role": "shared", "definition": "Transaction, local and group currency with plan/actual/prior-year rate variants \u2014 constant-FX reporting (act@planRate, @pyRate) and organic-growth flags depend on it.", "attributes": ["currencyCode", "rateType", "planRate", "closingRate", "averageRate", "constantFxVariant"], "formulas": [], "evidence": "Canon \u00a72.41; consolidation currency-translation vocabulary.", "notes": null, "origin": "reference", "change_state": "unchanged", "added_in_version": 0}, {"key": "g2n", "name": "GrossToNetWaterfall", "ref_name": "GrossToNetWaterfall", "group_key": "f2", "group_name": "F2 Management Reporting & Gross-to-Net", "color": "#8A4FD0", "kind": "domain", "role": "core", "definition": "The cross-domain revenue waterfall (gross \u2192 invoiced \u2192 net) populated by trade terms, promotions and deductions \u2014 finance's contract with the commercial domains; four instances evidenced across clients. Instantiated based on contracted trade terms, on-invoice promotional discounts, and retrospective volume rebates for traditional channels. An alternative Direct-to-Consumer waterfall variant is used for digital ecommerce channels that bypass standard distributor margins.", "attributes": ["waterfallStage", "tradeTermType", "onOffInvoice", "accrualBasis"], "formulas": [], "evidence": "Canon \u00a72.22; tobacco-major & brewer trade programs.", "notes": null, "origin": "reference", "change_state": "modified", "added_in_version": 0}, {"key": "granmatrix", "name": "GranularityMatrix", "ref_name": "GranularityMatrix", "group_key": "f2", "group_name": "F2 Management Reporting & Gross-to-Net", "color": "#8A4FD0", "kind": "domain", "role": "core", "definition": "Which P&L line legitimately exists at which grain (SKU vs brand vs company) \u2014 the honesty matrix that stops allocation fiction below the line where costs are actually incurred. It also includes rules for allocation at different granularities and under which circumstances would costs be allocated below the allocation ceiling.", "attributes": ["rli\u00d7grain matrix", "allocationCeiling", "publishRule", "brandHierarchy", "skuCode", "channelMapping", "activityDriverRule", "managementReportingMandate"], "formulas": [], "evidence": "HPC-major UK granularity matrix (evidenced verbatim).", "notes": "Updated to include allocationCeiling, activityDriverRule, and managementReportingMandate attributes.", "origin": "reference", "change_state": "unchanged", "added_in_version": 0}, {"key": "metricdef", "name": "MetricDefinition", "ref_name": "MetricDefinition", "group_key": "spine", "group_name": "Finance master-data spine", "color": "#5A8AC3", "kind": "spine", "role": "shared", "definition": "Governed KPI dictionary: every finance metric carries a verbatim formula, grain, source, owning role and RAG thresholds \u2014 the rationalization benchmark is 400 \u2192 30 metrics.", "attributes": ["metricName", "formula (verbatim)", "uom", "timeGrains[]", "owningRole", "ragThresholds", "leadLagClass", "nonAggregationRule"], "formulas": [], "evidence": "Nutrition-group metric lists; canon \u00a72.44 metric rationalization.", "notes": null, "origin": "reference", "change_state": "unchanged", "added_in_version": 0}, {"key": "mgmtpack", "name": "ExecutivePerformanceDeck", "ref_name": "ManagementReportingPack", "group_key": "f2", "group_name": "F2 Management Reporting & Gross-to-Net", "color": "#8A4FD0", "kind": "domain", "role": "core", "definition": "The MoM/flash reporting cycle: flash results include key executive KPIs, commentary includes items with significant variance (>5% vs Plan), one-version-of-truth pack from the RLI tree, versioned against plan/PPR/LE \u2014 the CFO pillar 'Bring one version of the truth' operationalized. Exclude immaterial or internal pass-through lines.", "attributes": ["packSections[]", "flashTiming", "commentaryWorkflow", "distribution"], "formulas": [], "evidence": "Finance MoM; FPM Finsight dashboards.", "notes": null, "origin": "reference", "change_state": "unchanged", "added_in_version": 0}, {"key": "orgnode", "name": "OrganizationNode", "ref_name": "OrganizationNode", "group_key": "spine", "group_name": "Finance master-data spine", "color": "#5A8AC3", "kind": "spine", "role": "shared", "definition": "Legal entity \u2192 business unit \u2192 function \u2192 cost/profit/investment center \u2192 role. Responsibility-center taxonomy (profit / investment / standard-cost / discretionary-expense / revenue) types each node for control purposes; DOA and SOD hang off it.", "attributes": ["entityId", "parent", "centerType", "currency", "doaLevel", "sharedServiceFlag", "consolidationScope"], "formulas": [], "evidence": "Canon \u00a72.0/\u00a72.44/\u00a72.54; consolidation scoping decks.", "notes": null, "origin": "reference", "change_state": "unchanged", "added_in_version": 0}, {"key": "pnlrli", "name": "PnLReportingLineItem", "ref_name": "PnLReportingLineItem", "group_key": "f2", "group_name": "F2 Management Reporting & Gross-to-Net", "color": "#8A4FD0", "kind": "domain", "role": "core", "definition": "The account roll-up ('RLI' pattern) instantiating gross-to-net down to net income \u2014 evidenced IBP waterfall: volume \u2192 grossTurnover \u2192 -discounts/rebates/incentives \u2192 netRevenue \u2192 -VIC \u2192 -VLC \u2192 MACO (= grossTurnover - VIC - VILC, verbatim) \u2192 -ZBB overheads \u2192 EBITDA \u2192 operationalFreeCashFlow by zone.", "attributes": ["rliCode", "parent", "sign", "formulaRefs", "macoFormula (verbatim)", "zoneRollup", "mapsToCoA", "linksToVarianceAnalysis", "connectsToPlanningVersion", "supportsFinancialConsolidation", "supportsManagementReporting"], "formulas": ["MACO = grossTurnover - VIC - VILC", "formulaRefs follow our waterfall hierarchy: base items roll up from Chart of Accounts, while calculated subtotals follow standard rules (Net Revenue = Gross - Deductions", "MACO = Gross Turnover - VIC - VILC). Custom formulas apply only for specific regional statutory needs or localized commercial trade agreements."], "evidence": "PNL Report by RU and PC1 (beverage-major BPC); global-brewer IBP.", "notes": null, "origin": "reference", "change_state": "unchanged", "added_in_version": 0}, {"key": "retkpi", "name": "Revenue KPI Cluster", "ref_name": "Revenue KPI Cluster", "group_key": "f2", "group_name": "F2 Management Reporting & Gross-to-Net", "color": "#8A4FD0", "kind": "domain", "role": "core", "definition": "The reporting formulas riding the waterfall \u2014 ISP% = (invoicedSales - M&L) / invoicedSales; retention = netSales / grossSales; MPC / statistical-case conversions for volume comparability.", "attributes": ["ispPct (verbatim)", "retentionPct (verbatim)", "mpcPerStatCase", "volumeBridge"], "formulas": ["ISP% = (invoicedSales - M&L) / invoicedSales", "retention = netSales / grossSales"], "evidence": "HPC-major consolidated P&L; nutrition-group metric lists.", "notes": null, "origin": "reference", "change_state": "unchanged", "added_in_version": 0}, {"key": "varanalysis", "name": "VarianceAnalysis", "ref_name": "VarianceAnalysis", "group_key": "f2", "group_name": "F2 Management Reporting & Gross-to-Net", "color": "#8A4FD0", "kind": "domain", "role": "core", "definition": "Multidimensional variance: vs plan / PPR / prior year, at constant FX (act@planRate, @pyRate), organic vs total, with price/volume/mix decomposition feeding commentary.", "attributes": ["varianceBasis", "fxBasis", "organicSplit", "pvmDecomposition"], "formulas": [], "evidence": "Canon \u00a72.41; HPC-major reporting conventions.", "notes": null, "origin": "reference", "change_state": "unchanged", "added_in_version": 0}];
    const rawEdges = [{"source": "account", "target": "pnlrli", "label": "rolls up to", "origin": "reference", "change_state": "unchanged", "added_in_version": 0, "cross_domain": false}, {"source": "orgnode", "target": "pnlrli", "label": "profit-center axis", "origin": "reference", "change_state": "unchanged", "added_in_version": 0, "cross_domain": false}, {"source": "currency", "target": "varanalysis", "label": "constant-FX basis", "origin": "reference", "change_state": "unchanged", "added_in_version": 0, "cross_domain": false}, {"source": "metricdef", "target": "retkpi", "label": "defines", "origin": "reference", "change_state": "unchanged", "added_in_version": 0, "cross_domain": false}, {"source": "g2n", "target": "pnlrli", "label": "instantiated by", "origin": "reference", "change_state": "unchanged", "added_in_version": 0, "cross_domain": false}, {"source": "pnlrli", "target": "retkpi", "label": "computes", "origin": "reference", "change_state": "unchanged", "added_in_version": 0, "cross_domain": false}, {"source": "granmatrix", "target": "pnlrli", "label": "constrains grain", "origin": "reference", "change_state": "unchanged", "added_in_version": 0, "cross_domain": false}, {"source": "pnlrli", "target": "mgmtpack", "label": "renders into", "origin": "reference", "change_state": "unchanged", "added_in_version": 0, "cross_domain": false}, {"source": "varanalysis", "target": "mgmtpack", "label": "commentary into", "origin": "reference", "change_state": "unchanged", "added_in_version": 0, "cross_domain": false}];

    // Build Legend
    const legendEl = document.getElementById('legend');
    const groupMap = new Map();
    rawNodes.forEach(n => {
      if (n.group_name && !groupMap.has(n.group_name)) {
        groupMap.set(n.group_name, n.color || '#8A4FD0');
      }
    });
    groupMap.forEach((color, name) => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<span class="legend-color" style="background:${color};box-shadow:0 0 6px ${color}"></span><span>${name}</span>`;
      legendEl.appendChild(item);
    });

    // Transform Nodes for Vis.js (White / Light Theme)
    const visNodes = rawNodes.map(n => {
      const nodeColor = n.color || '#8A4FD0';
      return {
        id: n.key,
        label: n.name,
        group: n.group_name,
        color: {
          background: '#FFFFFF',
          border: nodeColor,
          highlight: {
            background: '#F0F9FF',
            border: nodeColor
          },
          hover: {
            background: '#F8FAFC',
            border: nodeColor
          }
        },
        font: {
          color: '#0F172A',
          size: 13,
          face: 'Inter, sans-serif',
          bold: true
        },
        shape: 'box',
        margin: 12,
        borderWidth: 2,
        borderWidthSelected: 3,
        shadow: {
          enabled: true,
          color: 'rgba(0, 0, 0, 0.08)',
          size: 8,
          x: 1,
          y: 3
        },
        raw: n
      };
    });

    // Transform Edges for Vis.js (White / Light Theme)
    const visEdges = rawEdges.map((e, idx) => {
      return {
        id: 'e_' + idx,
        from: e.source,
        to: e.target,
        label: e.label || '',
        arrows: {
          to: {
            enabled: true,
            scaleFactor: 0.8
          }
        },
        color: {
          color: '#94A3B8',
          highlight: '#2563EB',
          hover: '#64748B'
        },
        font: {
          color: '#475569',
          size: 11,
          face: 'Inter, sans-serif',
          align: 'middle',
          background: 'rgba(255, 255, 255, 0.95)'
        },
        smooth: {
          type: 'curvedCW',
          roundness: 0.2
        },
        length: 220
      };
    });

    const container = document.getElementById('network-container');
    const nodesDataset = new vis.DataSet(visNodes);
    const edgesDataset = new vis.DataSet(visEdges);

    const data = {
      nodes: nodesDataset,
      edges: edgesDataset
    };

    const options = {
      physics: {
        enabled: true,
        solver: 'forceAtlas2Based',
        forceAtlas2Based: {
          gravitationalConstant: -50,
          centralGravity: 0.01,
          springLength: 160,
          springConstant: 0.08,
          damping: 0.4
        },
        stabilization: {
          iterations: 160,
          updateInterval: 25
        }
      },
      interaction: {
        hover: true,
        tooltipDelay: 150,
        selectable: true,
        multiselect: false,
        navigationButtons: false,
        zoomView: true,
        dragView: true
      }
    };

    const network = new vis.Network(container, data, options);

    // Inspector elements
    const inspector = document.getElementById('inspector');
    const inspName = document.getElementById('insp-name');
    const inspGroup = document.getElementById('insp-group');
    const inspDef = document.getElementById('insp-def');
    const inspAttrs = document.getElementById('insp-attrs');
    const inspAttrsSection = document.getElementById('insp-attrs-section');
    const inspFormulas = document.getElementById('insp-formulas');
    const inspFormulasSection = document.getElementById('insp-formulas-section');
    const inspClose = document.getElementById('insp-close');

    function showDetails(nodeRaw) {
      if (!nodeRaw) {
        inspector.classList.remove('open');
        return;
      }
      inspName.textContent = nodeRaw.name || nodeRaw.key;
      inspGroup.textContent = nodeRaw.group_name || 'Management Reporting and Gross-to-Net';
      inspDef.textContent = nodeRaw.definition || 'No definition available.';

      const attrs = nodeRaw.attributes || [];
      if (attrs.length > 0) {
        inspAttrsSection.style.display = 'block';
        inspAttrs.innerHTML = attrs.map(a => `<span class="tag">${typeof a === 'string' ? a : (a.name || a.key)}</span>`).join('');
      } else {
        inspAttrsSection.style.display = 'none';
      }

      const formulas = nodeRaw.formulas || [];
      if (formulas.length > 0) {
        inspFormulasSection.style.display = 'block';
        inspFormulas.innerHTML = formulas.map(f => `<div class="formula-tag">${typeof f === 'string' ? f : (f.name || f.expression)}</div>`).join('');
      } else {
        inspFormulasSection.style.display = 'none';
      }

      inspector.classList.add('open');
    }

    inspClose.onclick = () => {
      inspector.classList.remove('open');
      network.unselectAll();
      try {
        window.parent.postMessage({ type: 'NODE_DESELECTED' }, '*');
      } catch(e) {}
    };

    // Network Selection Events
    network.on('selectNode', function(params) {
      if (params.nodes && params.nodes.length > 0) {
        const nodeId = params.nodes[0];
        const vNode = nodesDataset.get(nodeId);
        if (vNode && vNode.raw) {
          showDetails(vNode.raw);
          try {
            window.parent.postMessage({
              type: 'NODE_SELECTED',
              key: nodeId,
              name: vNode.label,
              node: vNode.raw
            }, '*');
          } catch(e) {}
        }
      }
    });

    network.on('deselectNode', function(params) {
      if (!params.nodes || params.nodes.length === 0) {
        inspector.classList.remove('open');
        try {
          window.parent.postMessage({ type: 'NODE_DESELECTED' }, '*');
        } catch(e) {}
      }
    });

    // Toolbar handlers
    document.getElementById('btn-fit').onclick = () => {
      network.fit({ animation: { duration: 600, easingFunction: 'easeInOutQuad' } });
    };

    document.getElementById('btn-zoom-in').onclick = () => {
      const scale = network.getScale() * 1.3;
      network.moveTo({ scale: scale, animation: { duration: 300 } });
    };

    document.getElementById('btn-zoom-out').onclick = () => {
      const scale = network.getScale() * 0.7;
      network.moveTo({ scale: scale, animation: { duration: 300 } });
    };

    let physicsEnabled = true;
    const physicsBtn = document.getElementById('btn-physics');
    physicsBtn.onclick = () => {
      physicsEnabled = !physicsEnabled;
      network.setOptions({ physics: { enabled: physicsEnabled } });
      physicsBtn.classList.toggle('active', physicsEnabled);
    };

    // Settle physics after initial stabilization
    network.once('stabilizationIterationsDone', function() {
      network.fit({ animation: { duration: 500 } });
      // Gently turn off continuous physics to save CPU
      setTimeout(() => {
        network.setOptions({ physics: { enabled: false } });
        physicsBtn.classList.remove('active');
        physicsEnabled = false;
      }, 1200);
    });

    // Listen to messages from React Parent
    window.addEventListener('message', function(event) {
      const data = event.data;
      if (!data) return;

      if (data.type === 'SELECT_NODE' && data.key) {
        network.selectNodes([data.key]);
        network.focus(data.key, { scale: 1.15, animation: { duration: 600, easingFunction: 'easeInOutQuad' } });
        const vNode = nodesDataset.get(data.key);
        if (vNode && vNode.raw) {
          showDetails(vNode.raw);
        }
      } else if (data.type === 'DESELECT_NODE') {
        network.unselectAll();
        inspector.classList.remove('open');
      } else if (data.type === 'FIT_GRAPH') {
        network.fit({ animation: { duration: 600 } });
      }
    });

    // Notify parent window that graph is ready
    window.parent.postMessage({ type: 'GRAPH_READY', slug: 'management-reporting-gross-to-net' }, '*');
  </script>
</body>
</html>
