<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Management Reporting and Gross-to-Net — Knowledge Graph</title>
  <script type="text/javascript" src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #111827 0%, #0b0f19 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f1f5f9;
      user-select: none;
    }
    #network-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    /* Top Toolbar */
    .toolbar {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 6px;
      z-index: 20;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.36);
    }
    .tool-btn {
      background: transparent;
      border: 1px solid transparent;
      color: #94a3b8;
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .tool-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.15);
    }
    .tool-btn.active {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border-color: rgba(59, 130, 246, 0.4);
    }
    /* Floating Domain Badge */
    .domain-badge {
      position: absolute;
      top: 16px;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 8px 14px;
      z-index: 20;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.36);
    }
    .domain-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #8A4FD0;
      box-shadow: 0 0 10px #8A4FD0;
    }
    .domain-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #ffffff;
    }
    .domain-stats {
      font-size: 11px;
      color: #94a3b8;
      margin-left: 4px;
    }
    /* Legend */
    .legend {
      position: absolute;
      bottom: 16px;
      left: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-width: 60%;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 8px 12px;
      z-index: 20;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.36);
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #cbd5e1;
      font-weight: 500;
    }
    .legend-color {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    /* Node Info Overlay */
    .inspector {
      position: absolute;
      bottom: 16px;
      right: 16px;
      width: 320px;
      max-height: 280px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 14px;
      z-index: 20;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
      display: none;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      transition: opacity 0.2s ease;
    }
    .inspector.open {
      display: flex;
    }
    .inspector-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 8px;
    }
    .inspector-title {
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
    }
    .inspector-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      color: #93c5fd;
    }
    .inspector-close {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 16px;
      cursor: pointer;
      line-height: 1;
    }
    .inspector-close:hover {
      color: #ffffff;
    }
    .inspector-def {
      font-size: 11px;
      line-height: 1.5;
      color: #94a3b8;
    }
    .inspector-section {
      margin-top: 4px;
    }
    .inspector-subtitle {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .tag-container {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .tag {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 10px;
      color: #cbd5e1;
      font-family: 'JetBrains Mono', monospace;
    }
    .formula-tag {
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 10px;
      color: #6ee7b7;
      font-family: 'JetBrains Mono', monospace;
      width: 100%;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div id="network-container"></div>

  <!-- Domain Header -->
  <div class="domain-badge">
    <div class="domain-dot"></div>
    <span class="domain-title">Management Reporting and Gross-to-Net</span>
    <span class="domain-stats">(10 nodes &middot; 9 edges)</span>
  </div>

  <!-- Action Controls -->
  <div class="toolbar">
    <button class="tool-btn" id="btn-fit" title="Fit to Screen">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
      Fit
    </button>
    <button class="tool-btn" id="btn-zoom-in" title="Zoom In">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    </button>
    <button class="tool-btn" id="btn-zoom-out" title="Zoom Out">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    </button>
    <button class="tool-btn active" id="btn-physics" title="Toggle Physics">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      Physics
    </button>
  </div>

  <!-- Groups Legend -->
  <div class="legend" id="legend"></div>

  <!-- Inspector Card -->
  <div class="inspector" id="inspector">
    <div class="inspector-header">
      <div>
        <div class="inspector-title" id="insp-name">Entity</div>
        <div class="inspector-badge" id="insp-group">Group</div>
      </div>
      <button class="inspector-close" id="insp-close">&times;</button>
    </div>
    <div class="inspector-def" id="insp-def"></div>
    <div class="inspector-section" id="insp-attrs-section">
      <div class="inspector-subtitle">Attributes</div>
      <div class="tag-container" id="insp-attrs"></div>
    </div>
    <div class="inspector-section" id="insp-formulas-section">
      <div class="inspector-subtitle">Key Calculation Formulas</div>
      <div id="insp-formulas"></div>
    </div>
  </div>

  <script type="text/javascript">
    const rawNodes = [{"key": "account", "name": "Account / CoA", "group_key": "spine", "group_name": "Finance master-data spine", "color": "#5A8AC3", "kind": "spine", "role": "shared", "definition": "Chart-of-accounts dimension with account intelligence (account type, rate type, depreciation logic carried as attributes rather than separate hierarchies) \u00e2\u20ac\u201d the 17-dimension planning reference model's anchor dimension.", "attributes": ["accountCode", "parent", "accountType", "rateType (avg/closing)", "signConvention", "rliMapping", "depreciationIntelligence"], "formulas": [], "origin": "reference", "change_state": "unchanged"}, {"key": "currency", "name": "Currency / FX", "group_key": "spine", "group_name": "Finance master-data spine", "color": "#5A8AC3", "kind": "spine", "role": "shared", "definition": "Transaction, local and group currency with plan/actual/prior-year rate variants \u00e2\u20ac\u201d constant-FX reporting (act@planRate, @pyRate) and organic-growth flags depend on it.", "attributes": ["currencyCode", "rateType", "planRate", "closingRate", "averageRate", "constantFxVariant"], "formulas": [], "origin": "reference", "change_state": "unchanged"}, {"key": "g2n", "name": "GrossToNetWaterfall", "group_key": "f2", "group_name": "F2 Management Reporting & Gross-to-Net", "color": "#8A4FD0", "kind": "domain", "role": "core", "definition": "The cross-domain revenue waterfall (gross \u00e2\u2020\u2019 invoiced \u00e2\u2020\u2019 net) populated by trade terms, promotions and deductions \u00e2\u20ac\u201d finance's contract with the commercial domains; four instances evidenced across clients.", "attributes": ["waterfallStage", "tradeTermType", "onOffInvoice", "accrualBasis"], "formulas": [], "origin": "reference", "change_state": "unchanged"}, {"key": "granmatrix", "name": "GranularityMatrix", "group_key": "f2", "group_name": "F2 Management Reporting & Gross-to-Net", "color": "#8A4FD0", "kind": "domain", "role": "core", "definition": "Which P&L line legitimately exists at which grain (SKU vs brand vs company) \u00e2\u20ac\u201d the honesty matrix that stops allocation fiction below the line where costs are actually incurred.", "attributes": ["rli\u00c3\u2014grain matrix", "allocationCeiling", "publishRule"], "formulas": [], "origin": "reference", "change_state": "unchanged"}, {"key": "metricdef", "name": "MetricDefinition", "group_key": "spine", "group_name": "Finance master-data spine", "color": "#5A8AC3", "kind": "spine", "role": "shared", "definition": "Governed KPI dictionary: every finance metric carries a verbatim formula, grain, source, owning role and RAG thresholds \u00e2\u20ac\u201d the rationalization benchmark is 400 \u00e2\u2020\u2019 30 metrics.", "attributes": ["metricName", "formula (verbatim)", "uom", "timeGrains[]", "owningRole", "ragThresholds", "leadLagClass", "nonAggregationRule"], "formulas": [], "origin": "reference", "change_state": "unchanged"}, {"key": "mgmtpack", "name": "ManagementReportingPack", "group_key": "f2", "group_name": "F2 Management Reporting & Gross-to-Net", "color": "#8A4FD0", "kind": "domain", "role": "core", "definition": "The MoM/flash reporting cycle: flash results, variance commentary, one-version-of-truth pack from the RLI tree, versioned against plan/PPR/LE \u00e2\u20ac\u201d the CFO pillar 'Bring one version of the truth' operationalized.", "attributes": ["packSections[]", "flashTiming", "commentaryWorkflow", "distribution"], "formulas": [], "origin": "reference", "change_state": "unchanged"}, {"key": "orgnode", "name": "OrganizationNode", "group_key": "spine", "group_name": "Finance master-data spine", "color": "#5A8AC3", "kind": "spine", "role": "shared", "definition": "Legal entity \u00e2\u2020\u2019 business unit \u00e2\u2020\u2019 function \u00e2\u2020\u2019 cost/profit/investment center \u00e2\u2020\u2019 role. Responsibility-center taxonomy (profit / investment / standard-cost / discretionary-expense / revenue) types each node for control purposes; DOA and SOD hang off it.", "attributes": ["entityId", "parent", "centerType", "currency", "doaLevel", "sharedServiceFlag", "consolidationScope"], "formulas": [], "origin": "reference", "change_state": "unchanged"}, {"key": "pnlrli", "name": "PnLReportingLineItem", "group_key": "f2", "group_name": "F2 Management Reporting & Gross-to-Net", "color": "#8A4FD0", "kind": "domain", "role": "core", "definition": "The account roll-up ('RLI' pattern) instantiating gross-to-net down to net income \u00e2\u20ac\u201d evidenced IBP waterfall: volume \u00e2\u2020\u2019 grossTurnover \u00e2\u2020\u2019 \u00e2\u02c6\u2019discounts/rebates/incentives \u00e2\u2020\u2019 netRevenue \u00e2\u2020\u2019 \u00e2\u02c6\u2019VIC \u00e2\u2020\u2019 \u00e2\u02c6\u2019VLC \u00e2\u2020\u2019 MACO (= grossTurnover \u00e2\u02c6\u2019 VIC \u00e2\u02c6\u2019 VILC, verbatim) \u00e2\u2020\u2019 \u00e2\u02c6\u2019ZBB overheads \u00e2\u2020\u2019 EBITDA \u00e2\u2020\u2019 operationalFreeCashFlow by zone.", "attributes": ["rliCode", "parent", "sign", "formulaRefs", "macoFormula (verbatim)", "zoneRollup"], "formulas": ["MACO = grossTurnover \u00e2\u02c6\u2019 VIC \u00e2\u02c6\u2019 VILC"], "origin": "reference", "change_state": "unchanged"}, {"key": "retkpi", "name": "Revenue KPI Cluster", "group_key": "f2", "group_name": "F2 Management Reporting & Gross-to-Net", "color": "#8A4FD0", "kind": "domain", "role": "core", "definition": "The reporting formulas riding the waterfall \u00e2\u20ac\u201d ISP% = (invoicedSales \u00e2\u02c6\u2019 M&L) \u00c3\u00b7 invoicedSales; retention = netSales \u00c3\u00b7 grossSales; MPC / statistical-case conversions for volume comparability.", "attributes": ["ispPct (verbatim)", "retentionPct (verbatim)", "mpcPerStatCase", "volumeBridge"], "formulas": ["ISP% = (invoicedSales \u00e2\u02c6\u2019 M&L) \u00c3\u00b7 invoicedSales", "retention = netSales \u00c3\u00b7 grossSales"], "origin": "reference", "change_state": "unchanged"}, {"key": "varanalysis", "name": "VarianceAnalysis", "group_key": "f2", "group_name": "F2 Management Reporting & Gross-to-Net", "color": "#8A4FD0", "kind": "domain", "role": "core", "definition": "Multidimensional variance: vs plan / PPR / prior year, at constant FX (act@planRate, @pyRate), organic vs total, with price/volume/mix decomposition feeding commentary.", "attributes": ["varianceBasis", "fxBasis", "organicSplit", "pvmDecomposition"], "formulas": [], "origin": "reference", "change_state": "unchanged"}];
    const rawEdges = [{"source": "account", "target": "pnlrli", "label": "rolls up to", "origin": "reference", "change_state": "unchanged", "cross_domain": false, "origin_graph": "finance-graph"}, {"source": "orgnode", "target": "pnlrli", "label": "profit-center axis", "origin": "reference", "change_state": "unchanged", "cross_domain": false, "origin_graph": "finance-graph"}, {"source": "currency", "target": "varanalysis", "label": "constant-FX basis", "origin": "reference", "change_state": "unchanged", "cross_domain": false, "origin_graph": "finance-graph"}, {"source": "metricdef", "target": "retkpi", "label": "defines", "origin": "reference", "change_state": "unchanged", "cross_domain": false, "origin_graph": "finance-graph"}, {"source": "g2n", "target": "pnlrli", "label": "instantiated by", "origin": "reference", "change_state": "unchanged", "cross_domain": false, "origin_graph": "finance-graph"}, {"source": "pnlrli", "target": "retkpi", "label": "computes", "origin": "reference", "change_state": "unchanged", "cross_domain": false, "origin_graph": "finance-graph"}, {"source": "granmatrix", "target": "pnlrli", "label": "constrains grain", "origin": "reference", "change_state": "unchanged", "cross_domain": false, "origin_graph": "finance-graph"}, {"source": "pnlrli", "target": "mgmtpack", "label": "renders into", "origin": "reference", "change_state": "unchanged", "cross_domain": false, "origin_graph": "finance-graph"}, {"source": "varanalysis", "target": "mgmtpack", "label": "commentary into", "origin": "reference", "change_state": "unchanged", "cross_domain": false, "origin_graph": "finance-graph"}];

    // Build Legend
    const legendEl = document.getElementById('legend');
    const groupMap = new Map();
    rawNodes.forEach(n => {
      if (n.group_name && !groupMap.has(n.group_name)) {
        groupMap.set(n.group_name, n.color || '#8A4FD0');
      }
    });
    groupMap.forEach((color, name) => {
      const item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = `<span class="legend-color" style="background:${color};box-shadow:0 0 6px ${color}"></span><span>${name}</span>`;
      legendEl.appendChild(item);
    });

    // Transform Nodes for Vis.js
    const visNodes = rawNodes.map(n => {
      const nodeColor = n.color || '#8A4FD0';
      return {
        id: n.key,
        label: n.name,
        group: n.group_name,
        color: {
          background: '#1e293b',
          border: nodeColor,
          highlight: {
            background: nodeColor,
            border: '#ffffff'
          },
          hover: {
            background: '#334155',
            border: '#ffffff'
          }
        },
        font: {
          color: '#f8fafc',
          size: 13,
          face: 'Inter, sans-serif',
          bold: true
        },
        shape: 'box',
        margin: 12,
        borderWidth: 2,
        borderWidthSelected: 3,
        shadow: {
          enabled: true,
          color: 'rgba(0, 0, 0, 0.4)',
          size: 10,
          x: 2,
          y: 4
        },
        raw: n
      };
    });

    // Transform Edges for Vis.js
    const visEdges = rawEdges.map((e, idx) => {
      return {
        id: 'e_' + idx,
        from: e.source,
        to: e.target,
        label: e.label || '',
        arrows: {
          to: {
            enabled: true,
            scaleFactor: 0.8
          }
        },
        color: {
          color: '#64748b',
          highlight: '#38bdf8',
          hover: '#94a3b8'
        },
        font: {
          color: '#94a3b8',
          size: 11,
          face: 'Inter, sans-serif',
          align: 'middle',
          background: '#0b0f19'
        },
        smooth: {
          type: 'curvedCW',
          roundness: 0.2
        },
        length: 220
      };
    });

    const container = document.getElementById('network-container');
    const nodesDataset = new vis.DataSet(visNodes);
    const edgesDataset = new vis.DataSet(visEdges);

    const data = {
      nodes: nodesDataset,
      edges: edgesDataset
    };

    const options = {
      physics: {
        enabled: true,
        solver: 'forceAtlas2Based',
        forceAtlas2Based: {
          gravitationalConstant: -50,
          centralGravity: 0.01,
          springLength: 160,
          springConstant: 0.08,
          damping: 0.4
        },
        stabilization: {
          iterations: 160,
          updateInterval: 25
        }
      },
      interaction: {
        hover: true,
        tooltipDelay: 150,
        selectable: true,
        multiselect: false,
        navigationButtons: false,
        zoomView: true,
        dragView: true
      }
    };

    const network = new vis.Network(container, data, options);

    // Inspector elements
    const inspector = document.getElementById('inspector');
    const inspName = document.getElementById('insp-name');
    const inspGroup = document.getElementById('insp-group');
    const inspDef = document.getElementById('insp-def');
    const inspAttrs = document.getElementById('insp-attrs');
    const inspAttrsSection = document.getElementById('insp-attrs-section');
    const inspFormulas = document.getElementById('insp-formulas');
    const inspFormulasSection = document.getElementById('insp-formulas-section');
    const inspClose = document.getElementById('insp-close');

    function showDetails(nodeRaw) {
      if (!nodeRaw) {
        inspector.classList.remove('open');
        return;
      }
      inspName.textContent = nodeRaw.name || nodeRaw.key;
      inspGroup.textContent = nodeRaw.group_name || 'Management Reporting and Gross-to-Net';
      inspDef.textContent = nodeRaw.definition || 'No definition available.';

      const attrs = nodeRaw.attributes || [];
      if (attrs.length > 0) {
        inspAttrsSection.style.display = 'block';
        inspAttrs.innerHTML = attrs.map(a => `<span class="tag">${typeof a === 'string' ? a : (a.name || a.key)}</span>`).join('');
      } else {
        inspAttrsSection.style.display = 'none';
      }

      const formulas = nodeRaw.formulas || [];
      if (formulas.length > 0) {
        inspFormulasSection.style.display = 'block';
        inspFormulas.innerHTML = formulas.map(f => `<div class="formula-tag">${typeof f === 'string' ? f : (f.name || f.expression)}</div>`).join('');
      } else {
        inspFormulasSection.style.display = 'none';
      }

      inspector.classList.add('open');
    }

    inspClose.onclick = () => {
      inspector.classList.remove('open');
      network.unselectAll();
      try {
        window.parent.postMessage({ type: 'NODE_DESELECTED' }, '*');
      } catch(e) {}
    };

    // Network Selection Events
    network.on('selectNode', function(params) {
      if (params.nodes && params.nodes.length > 0) {
        const nodeId = params.nodes[0];
        const vNode = nodesDataset.get(nodeId);
        if (vNode && vNode.raw) {
          showDetails(vNode.raw);
          try {
            window.parent.postMessage({
              type: 'NODE_SELECTED',
              key: nodeId,
              name: vNode.label,
              node: vNode.raw
            }, '*');
          } catch(e) {}
        }
      }
    });

    network.on('deselectNode', function(params) {
      if (!params.nodes || params.nodes.length === 0) {
        inspector.classList.remove('open');
        try {
          window.parent.postMessage({ type: 'NODE_DESELECTED' }, '*');
        } catch(e) {}
      }
    });

    // Toolbar handlers
    document.getElementById('btn-fit').onclick = () => {
      network.fit({ animation: { duration: 600, easingFunction: 'easeInOutQuad' } });
    };

    document.getElementById('btn-zoom-in').onclick = () => {
      const scale = network.getScale() * 1.3;
      network.moveTo({ scale: scale, animation: { duration: 300 } });
    };

    document.getElementById('btn-zoom-out').onclick = () => {
      const scale = network.getScale() * 0.7;
      network.moveTo({ scale: scale, animation: { duration: 300 } });
    };

    let physicsEnabled = true;
    const physicsBtn = document.getElementById('btn-physics');
    physicsBtn.onclick = () => {
      physicsEnabled = !physicsEnabled;
      network.setOptions({ physics: { enabled: physicsEnabled } });
      physicsBtn.classList.toggle('active', physicsEnabled);
    };

    // Settle physics after initial stabilization
    network.once('stabilizationIterationsDone', function() {
      network.fit({ animation: { duration: 500 } });
      // Gently turn off continuous physics to save CPU
      setTimeout(() => {
        network.setOptions({ physics: { enabled: false } });
        physicsBtn.classList.remove('active');
        physicsEnabled = false;
      }, 1200);
    });

    // Listen to messages from React Parent
    window.addEventListener('message', function(event) {
      const data = event.data;
      if (!data) return;

      if (data.type === 'SELECT_NODE' && data.key) {
        network.selectNodes([data.key]);
        network.focus(data.key, { scale: 1.15, animation: { duration: 600, easingFunction: 'easeInOutQuad' } });
        const vNode = nodesDataset.get(data.key);
        if (vNode && vNode.raw) {
          showDetails(vNode.raw);
        }
      } else if (data.type === 'DESELECT_NODE') {
        network.unselectAll();
        inspector.classList.remove('open');
      } else if (data.type === 'FIT_GRAPH') {
        network.fit({ animation: { duration: 600 } });
      }
    });

    // Notify parent window that graph is ready
    window.parent.postMessage({ type: 'GRAPH_READY', slug: 'management-reporting-gross-to-net' }, '*');
  </script>
</body>
</html>
